name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality & Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.4.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest Unit Tests
        run: pnpm test

      - name: TypeScript Check & Vite Build
        run: pnpm build

  backend:
    name: Rust Backend Verification Gate
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt Formatting Check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy Strict Lint Gate (-D warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Backend Unit & Domain Tests
        working-directory: src-tauri
        run: cargo test --lib && cargo test --test domain_tests
